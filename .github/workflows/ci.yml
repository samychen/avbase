name: ci

on: [push, pull_request]

jobs:
  # Fast gate: no FFmpeg, no X11, no SDL2. Proves design goal G2 -- the core
  # builds and its tests pass with nothing but a C++20 compiler.
  quick:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build python3
      - run: cmake --preset no-ffmpeg
      - run: cmake --build --preset no-ffmpeg
      - run: python3 tools/check_invariants.py --root .
      - run: ctest --preset no-ffmpeg --output-on-failure

  # The system-FFmpeg configuration. Until this job existed, everything behind
  # AVBASE_ENABLE_FFMPEG -- the whole platform_ffmpeg target plus the 35
  # needs-ffmpeg tests -- was only ever built on a developer machine: the
  # no-ffmpeg gate proves G2, not that the FFmpeg path works. A14 (distro
  # FFmpeg, no patch, no vendoring) is what this asserts.
  ffmpeg:
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3 pkg-config \
            libavformat-dev libavcodec-dev libavutil-dev \
            libswscale-dev libswresample-dev
      - run: cmake --preset ffmpeg
      - run: cmake --build --preset ffmpeg
      - run: python3 tools/check_invariants.py --root .
      - run: ctest --preset ffmpeg

  # The half of the old e2e-linux stub that needs no display: examples/headless
  # drives decode -> sync -> render against the null sinks and exits 0 only when
  # the player reports kCompleted, so this is the end-to-end gate the SDK can
  # run on any machine. The window path (xvfb + llvmpipe, both Linux backends)
  # stays in e2e-linux below.
  e2e-headless:
    needs: ffmpeg
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3 pkg-config \
            libavformat-dev libavcodec-dev libavutil-dev \
            libswscale-dev libswresample-dev
      - run: cmake --preset ffmpeg
      - run: cmake --build --preset ffmpeg
      - name: Play the test media to completion
        run: |
          set -u
          headless=build/ffmpeg/bin/headless
          fail=0
          for f in small_h264_aac_3s.mp4 audio_only.m4a video_only.mp4 \
                   truncated_tail.mp4; do
            if "$headless" "tests/testdata/$f" --timeout 60 > /dev/null 2>&1; then
              echo "ok   $f -> kCompleted"
            else
              echo "::error::$f did not reach kCompleted (exit $?)"
              fail=1
            fi
          done
          if "$headless" tests/testdata/small_h264_aac_3s.mp4 --seek 1.5 \
               --timeout 60 > /dev/null 2>&1; then
            echo "ok   --seek 1.5 -> kCompleted"
          else
            echo "::error::--seek 1.5 did not reach kCompleted"
            fail=1
          fi
          # A corrupt file must fail *with* the actionable detail, and must not
          # "succeed": the exit code and the message are both asserted. The log
          # goes to the runner's temp dir, not into the checkout.
          log="$RUNNER_TEMP/corrupt.log"
          if "$headless" tests/testdata/corrupt_header.mp4 --timeout 30 \
               > "$log" 2>&1; then
            echo "::error::corrupt_header.mp4 unexpectedly reached kCompleted"
            fail=1
          elif ! grep -q DecodeFailed "$log"; then
            echo "::error::corrupt_header.mp4 failed without the DecodeFailed detail"
            sed -n '1,40p' "$log"
            fail=1
          else
            echo "ok   corrupt_header.mp4 -> actionable failure"
          fi
          exit $fail
      # End-to-end CPU (docs/04 §8, docs/07 §10). Recorded, never failed:
      # the committed baseline was measured on macOS with VideoToolbox, and
      # this runner decodes with VAAPI or software, so absolute CPU per media
      # second is not comparable across them. The trend on one machine is what
      # matters, and that is gate_local --jobs e2ecpu.
      - name: Measure end-to-end CPU
        run: |
          python3 tools/measure_e2e_cpu.py \
            --headless build/ffmpeg/bin/headless --runs 5 \
            --jsonl e2e-cpu.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: e2e-cpu
          path: e2e-cpu.jsonl
      - name: Compare against the committed baseline (report only)
        run: |
          python3 tools/check_bench_regression.py \
            --baseline tools/e2e-cpu-baseline.jsonl \
            --current e2e-cpu.jsonl --value-key cpu_ms_per_media_s \
            --tolerance tools/e2e-cpu-tolerance.json || true

  # platform/sdl2 had only ever been compiled on macOS, against Homebrew's
  # SDL2. Ubuntu's libsdl2-dev is a different SDL2 (and a different audio
  # stack), and play_sdl2 is the target that proves the backend links -- so
  # build the whole preset here. Running the window is e2e-linux's job.
  sdl2-build:
    needs: quick
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain, FFmpeg and SDL2
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3 pkg-config libsdl2-dev \
            libavformat-dev libavcodec-dev libavutil-dev \
            libswscale-dev libswresample-dev
      - run: cmake --preset linux-sdl2
      - run: cmake --build build/linux-sdl2

  # The strict-warnings gate: Debug + DCHECKs + -Wconversion/-Wold-style-cast +
  # -Werror, over the FFmpeg layer too. The compiler is clang on purpose: the
  # strict set adds GCC's -Wuseless-cast (cmake/AvbaseCompilerFlags.cmake),
  # which has never been vetted against this tree, and a gate that arrives red
  # teaches people to ignore gates. The GCC half of this job is now open:
  # the last blocker (the make_shared<atomic<int>> -Wnull-dereference false
  # positive) was wrapped out of the tree, and -Wuseless-cast gets its first
  # vetting here -- if the GCC lane lands red, that is a real finding to fix,
  # not noise.
  strict:
    needs: ffmpeg
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - { cc: clang, cxx: clang++ }
          - { cc: gcc,   cxx: g++ }
    runs-on: ubuntu-24.04
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3 pkg-config clang \
            libavformat-dev libavcodec-dev libavutil-dev \
            libswscale-dev libswresample-dev
      - run: cmake --preset debug
      - run: cmake --build --preset debug
      - run: python3 tools/check_invariants.py --root .
      - run: ctest --preset debug

  full:
    needs: quick
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, preset: no-ffmpeg, label: core-gcc11 }
          - { os: ubuntu-24.04, preset: no-ffmpeg, label: core-gcc13 }
          - { os: ubuntu-24.04, preset: asan,      label: asan }
          - { os: ubuntu-24.04, preset: tsan,      label: tsan }
          - { os: ubuntu-24.04, preset: ubsan,     label: ubsan }
          - { os: ubuntu-24.04, preset: coverage,  label: coverage }
          - { os: macos-14,     preset: no-ffmpeg, label: macos }
          # Homebrew is the FFmpeg the tenth round had to fix (the include
          # usage requirements did not survive FindFFmpeg's pkg-config hop, and
          # Apple's filesystem shadowed <version>). Worth one macOS runner.
          - { os: macos-14,     preset: ffmpeg,    label: macos-ffmpeg }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y ninja-build python3
          else
            brew install ninja python3
            if [ "${{ matrix.preset }}" = "ffmpeg" ]; then
              brew install ffmpeg
            fi
          fi
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build build/${{ matrix.preset }}
      - run: python3 tools/check_invariants.py --root .
      # Before ctest, not after: a green test run over a stale binary is a
      # green run over code that no longer exists. Building part of the tree
      # leaves an executable older than the library it links while reporting
      # success -- the tell is the test COUNT, since a tree that gained tests
      # reports the old, smaller number. See docs/BUILDING.md §5.
      - run: python3 tools/check_binary_freshness.py --root build/${{ matrix.preset }}
      - run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure
      - if: matrix.label == 'coverage'
        run: |
          # The tracefile is produced by tools/gcov_to_lcov.py on EVERY
          # platform, including Linux where lcov is also installed. One
          # producer is deliberate: the ratchet compares today's numbers
          # against coverage_baseline.json, and two different producers
          # (lcov vs gcov) disagree on branch accounting and path spelling
          # enough to manufacture phantom regressions.
          python3 tools/gcov_to_lcov.py --root build/coverage --source . \
              -o cov.info --exclude 'third_party/'
          python3 tools/check_coverage.py --info cov.info \
              --baseline coverage_baseline.json --ratchet

  # Still a stub, and enabling it is the milestone's job: G12/A16 ask for both
  # Linux backends playing 1080p30 under xvfb + llvmpipe, which needs the
  # native GL backend (M12) and a verify_e2e.py that does not exist yet. The
  # headless half of the same acceptance runs for real in e2e-headless above.
  e2e-linux:
    if: false   # M11/M12: xvfb + llvmpipe, both backends, verify_e2e.py
    runs-on: ubuntu-24.04
    steps: [{ run: echo "xvfb + llvmpipe playback verification lands at M11/M12" }]

  # The fuzz harness (Phase 4.5): coverage-guided where the runner has the
  # libFuzzer runtime (Ubuntu clang does), corpus seeds re-run every push so
  # a regression found by mutation cannot sneak back in. macOS runners are
  # excluded on purpose: Xcode's clang ships without libFuzzer.
  fuzz-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3 pkg-config clang             libavformat-dev libavcodec-dev libavutil-dev             libswscale-dev libswresample-dev
      - name: Configure (fuzzer + ASan)
        run: |
          cmake -B build/fuzz -G Ninja -DAVBASE_ENABLE_FFMPEG=ON \
            -DAVBASE_BUILD_TESTS=OFF -DAVBASE_BUILD_EXAMPLES=OFF \
            -DAVBASE_BUILD_FUZZ=ON \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_FLAGS="-fsanitize=fuzzer,address" \
            -DCMAKE_CXX_FLAGS="-fsanitize=fuzzer,address"
      - run: cmake --build build/fuzz
      - name: Corpus seeds + 60s coverage-guided run
        run: |
          timeout 60 ./build/fuzz/bin/avbase_fuzz_demuxer \
            tests/fuzz/seeds -max_total_time=60 -rss_limit_mb=2048 || [ $? -eq 124 ]
          ./build/fuzz/bin/avbase_fuzz_demuxer_standalone --iters 16

  # Windows / MSVC (docs/12 4.5). The first target on this platform, and the
  # one that has never been built here -- so read the claims below as claims,
  # not as verified facts.
  #
  # WHAT IS ACTUALLY KNOWN vs WHAT THIS JOB IS FOR:
  #   * KNOWN: the compiler-flag layer already branches per platform
  #     (cmake/AvbaseCompilerFlags.cmake: /GR- /EHs-c- for MSVC versus
  #     -fno-exceptions -fno-rtti elsewhere), because MSVC has no
  #     -fno-exceptions equivalent. That branch is why the risk was
  #     tractable rather than a rewrite.
  #   * NOT KNOWN: whether the tree compiles at all under MSVC. Nobody has run
  #     it. VLOG uses __attribute__((format)) in places, and MSVC spells
  #     several GNU attributes differently; the strict warning set is Clang and
  #     GCC oriented by construction.
  #
  # Therefore this job is scoped to the gate the project can actually hold
  # itself to on a platform it has not validated: IT COMPILES AND THE TESTS
  # PASS on the no-ffmpeg configuration. It is deliberately not given
  # -Werror-equivalent strictness (/WX) -- turning on the strictest warnings for
  # a first-time platform produces a wall of red that hides the one signal
  # worth having, which is "does this toolchain work at all".
  #
  # FFmpeg is NOT built here on purpose. vcpkg's ffmpeg would add an hours-long
  # dependency build to every run for a layer that is orthogonal to "does our
  # own code compile on MSVC".
  # Protocol coverage (docs/12 2.4). HLS VOD and HTTP progressive over a REAL
  # socket, with the media generated locally at run time -- so this is a network
  # test that needs no network, and no test asset has to be committed.
  #
  # RTMP/RTSP/SRT are deliberately absent: they cannot be served from a file,
  # so they need a real peer. Leaving them out is honest; a fake local stand-in
  # would be theatre.
  protocols:
    needs: ffmpeg
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain, FFmpeg and the CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3 pkg-config ffmpeg \
            libavformat-dev libavcodec-dev libavutil-dev \
            libswscale-dev libswresample-dev
      - run: cmake --preset ffmpeg
      - run: cmake --build --preset ffmpeg
      - name: HLS VOD and HTTP progressive
        run: |
          python3 tools/check_protocols.py \
            --headless build/ffmpeg/bin/headless \
            --ffmpeg "$(command -v ffmpeg)" \
            --testdata tests/testdata

  # Degraded network (docs/12 2.5). 2.4 proves a loopback socket works, which is
  # the easiest network in the world; this one throttles the source to below
  # real time and then breaks it, because a source that is faster than playback
  # never makes the player interleave reading with rendering at all. The damage
  # is applied in the httpd rather than with `tc netem` on purpose: netem needs
  # root and does not exist on macOS, so it could only ever run here, and a gate
  # only CI can run is a gate nobody can reproduce. Needs no sudo.
  weaknet:
    needs: ffmpeg
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain, FFmpeg and the CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3 pkg-config ffmpeg \
            libavformat-dev libavcodec-dev libavutil-dev \
            libswscale-dev libswresample-dev
      - run: cmake --preset ffmpeg
      - run: cmake --build --preset ffmpeg
      - name: Throttled, lossy and dead source
        run: |
          python3 tools/check_weaknet.py \
            --headless build/ffmpeg/bin/headless \
            --ffmpeg "$(command -v ffmpeg)" \
            --testdata tests/testdata

  # The windowed player, built where it actually ships. Every other macOS entry
  # in this file builds the core against the NULL sinks, so nothing on this
  # platform ever compiled the one binary a Mac user runs -- and an unbuilt
  # binary is not a cross-platform library, it is a hope. Measured on macOS-14
  # before this job existed: 175 targets, play_sdl2 linked, 481 cases green.
  #
  # Deliberately Linux jobs do NOT cover this: `sdl2-build` proves the SDL2
  # backend compiles, which is a different claim from "it compiles where the
  # window opens". SDL2 and FFmpeg come from Homebrew; the library layer is the
  # same libavcodec the ffmpeg job already uses, so this is the shell, not a
  # second copy of the engine.
  macos-player:
    needs: ffmpeg
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain, SDL2 and FFmpeg
        run: |
          brew install ninja sdl2 ffmpeg pkg-config
      - run: cmake --preset macos-sdl2
      - run: cmake --build --preset macos-sdl2
      - run: python3 tools/check_invariants.py --root .
      # Same reason as the matrix job: this is the one build that enables the
      # VideoToolbox hardware decoder, so "the hardware path is broken" is a
      # claim you want backed by a binary that is actually current.
      - run: python3 tools/check_binary_freshness.py --root build/macos-sdl2
      - run: ctest --test-dir build/macos-sdl2 --output-on-failure
      - name: The player binary exists and is a real executable
        run: |
          test -x build/macos-sdl2/bin/play_sdl2
          # -h must not need a display: if argument parsing opens a window on the
          # wrong path, this is where it shows, on a headless CI box.
          build/macos-sdl2/bin/play_sdl2 --help 2>&1 | head -3 || true
          otool -L build/macos-sdl2/bin/play_sdl2 | grep -i sdl2

  # Corpus + soak (docs/12 4.3 / 4.4). Both are measured rather than asserted
  # once: the corpus writes a baseline the next run compares against, and the
  # soak gates on the SLOPE of the memory curve instead of on a stopwatch.
  corpus:
    needs: ffmpeg
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain, FFmpeg and the CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3 pkg-config ffmpeg \
            libavformat-dev libavcodec-dev libavutil-dev \
            libswscale-dev libswresample-dev
      - run: cmake --preset ffmpeg
      - run: cmake --build --preset ffmpeg
      # BLOCKING as of this commit. It was continue-on-error while the shutdown
      # race was open; that race is fixed (0 crashes over 29 samples, three
      # consecutive runs), so the gate can go green and a regression can now
      # actually block. Leaving it non-blocking after the fix would mean the
      # next regression is reported by a person rather than by CI.
      #
      # PRs run the standard profile: the full matrix is 315 samples and ~16
      # minutes, and that cost belongs on the weekly run, not on every PR. The
      # standard profile keeps every family represented, so a per-family
      # regression still blocks; the weekly corpus-full workflow re-measures
      # the full matrix -- the only profile that carries the combination block
      # -- against its own baseline and refreshes the artifact.
      - name: Dimensional corpus and its four metrics (standard)
        run: |
          python3 tools/check_corpus.py \
            --headless build/ffmpeg/bin/headless \
            --ffmpeg "$(command -v ffmpeg)" \
            --profile standard \
            --baseline corpus_baseline.json
      - name: Keep the corpus metrics as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-metrics
          path: ${{ runner.temp }}/corpus_baseline.json

  # The C ABI (docs/08 M15). Until this job existed the C ABI had no gate at
  # all: AVBASE_ENABLE_CAPI was in no preset, so no runner ever compiled
  # avbase_cabi, and the only acceptance was tools/check_capi.sh -- which
  # carried -mmacosx-version-min and seven hardcoded paths into one developer's
  # pinned-FFmpeg build tree, so it could not have run here even if a job had
  # called it. The consequence was a header that could rot into "compiles under
  # C++ only" without anything going red, which for a compatibility layer is
  # the one failure that matters: it would still work for every existing C++
  # caller and break the first C or JNI host.
  #
  # What this asserts is the boundary, not a branch: capi_smoke_test.c is
  # compiled by the C compiler at C99 with -Werror (a C++-ism reaching
  # avbase_c.h fails here), linked against avbase::cabi, and run to
  # kCompleted. It needs FFmpeg because the test plays a real file.
  capi:
    needs: ffmpeg
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3 pkg-config \
            libavformat-dev libavcodec-dev libavutil-dev \
            libswscale-dev libswresample-dev
      - run: cmake --preset capi
      - run: python3 tools/check_invariants.py --root .
      - run: cmake --build --preset capi
      - name: The C boundary holds (compiled by cc, run to kCompleted)
        run: |
          # Anchored on purpose: a bare -R capi_smoke_test would also match
          # VideoFrameCompositorTest.FpsCapIgnoredBeforeFirstPresent, so the
          # "C ABI gate" would quietly grow a second, unrelated test every
          # time somebody named something with "capi" inside it. $ and ^ are
          # what pin it to this one test.
          ctest --test-dir build/capi -R '^capi_smoke_test$' --output-on-failure
      - name: The header is C, not just C++
        run: |
          # The compile above already proves it, but with the project's own
          # flags. This is the same header against a bare, warning-clean C99
          # command so the claim does not rest on one configuration: a C host
          # on another toolchain gets this and nothing else.
          cc -std=c99 -Wall -Wextra -Werror -pedantic \
            -I. -fsyntax-only player/public/c/capi_smoke_test.c

  # Soak. minutes: 48 is the deliverable; the CI job runs 10 because a GitHub
  # job cannot be trusted to still be alive in 48 hours, and a gate that times
  # out teaches nothing. The 48-hour run is a local or self-hosted invocation
  # of the same script with the same arguments -- not a different code path.
  soak:
    needs: ffmpeg
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain, FFmpeg and the CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3 pkg-config ffmpeg \
            libavformat-dev libavcodec-dev libavutil-dev \
            libswscale-dev libswresample-dev
      - run: cmake --preset asan -DAVBASE_BUILD_FUZZ=ON
      - run: cmake --build --preset asan --target avbase_fuzz_demuxer_standalone
      - name: 10-minute soak under ASan + UBSan
        run: |
          python3 tools/run_soak.py \
            --driver build/asan/bin/avbase_fuzz_demuxer_standalone \
            --minutes 10 --sample-seconds 15 \
            --out "$RUNNER_TEMP/soak.json"
      - name: Keep the memory curve as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-memory-curve
          path: ${{ runner.temp }}/soak.json

  windows-msvc:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure (no-ffmpeg)
        run: cmake --preset no-ffmpeg -B build/msvc
      - name: Build
        run: cmake --build build/msvc --config Debug --parallel
      - name: Test
        run: ctest --test-dir build/msvc -C Debug --output-on-failure
      - name: Invariants
        run: python tools/check_invariants.py --root .

  # Opened in this round, once the reason it was deferred stopped being true.
  # The old note said check-format "would be red on the first run" because the
  # C23 ratchet existed to grandfather 310 over-length lines; the tree is now
  # clang-format clean and that baseline is down to 37 lines, so a gate that
  # passes is a gate worth having (R12: a red-on-day-one gate teaches people to
  # ignore gates).
  #
  # It checks the WHOLE tree, not just the diff. A diff-scoped check (the
  # git-clang-format shape) is cheaper to satisfy and correspondingly easier to
  # route around, and the whole point here is that .clang-format is the single
  # source of truth for style -- which is only true if drift anywhere is caught.
  check-format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: clang-format must report no changes
        run: |
          # Same exclusion set the local sweep used: media/filters/legacy/ is
          # the LGPL-2.1 quarantine (its provenance comments must keep the
          # shape ijkplayer had), option_registry.inc is generated, and
          # render/gl/third_party/ is the vendored glad output -- all three are
          # text the formatter is not entitled to rewrite.
          #
          # 'player/public/c/*.c' is here because of capi_smoke_test.c, not
          # because the tree is suddenly C: the C ABI's whole gate is that its
          # header is valid C, and a file nothing formats drifts until someone
          # notices it in a review. Scoped to that ONE directory on purpose --
          # the only other .c in the tree is cmake/FFmpegVersionProbe.c, a
          # CMake try_run() probe that is build scaffolding rather than project
          # source. Widening this to '*.c' for the sake of one file turned the
          # gate red on its first run (R12: a gate that arrives red teaches
          # people to ignore gates), and "fix" the probe would be editing
          # text nobody owns. If a second real C source appears, add its
          # directory here rather than the whole extension.
          mapfile -t FILES < <(git ls-files '*.cc' '*.h' 'player/public/c/*.c' \
            | grep -v 'media/filters/legacy/' \
            | grep -v 'player/option_registry.inc' \
            | grep -v 'third_party/')
          echo "checking ${#FILES[@]} files"
          clang-format --dry-run --Werror --style=file "${FILES[@]}"

  # clang-tidy over the project config (.clang-tidy). Scoped to non-test,
  # non-legacy sources: tests carry gtest idioms the config was not tuned for,
  # and media/filters/legacy/ is the LGPL quarantine where formatting/provenance
  # rules deliberately differ. The check-cpplint job below mirrors this file
  # list exactly.
  #
  # Two things this job used to get wrong, both of which made it green by
  # checking less than it claimed (R12: a gate must arrive green to be believed,
  # and a gate that is green because it did not run is worse than no gate):
  #
  #   1. -header-filter was '^((?!third_party|legacy|/tests/).)*$'. clang-tidy's
  #      Regex is POSIX ERE, which has no negative lookahead, so that pattern
  #      never matched a header and NO header was ever checked -- one TU gave 17
  #      findings with it and 1095 without. There is no --exclude-header-filter
  #      in clang-tidy 18, so the header scope now comes from .clang-tidy's
  #      HeaderFilterRegex (one source of truth) and no -header-filter is passed.
  #      media/filters/legacy/ headers are inside that regex; they produce
  #      nothing, and if they ever do this job says so.
  #
  #   2. The file list came from git ls-files but clang-tidy can only analyse a
  #      file the compilation database knows about, and every backend under
  #      platform/ is behind an option that `ffmpeg` does not set. run-clang-tidy
  #      SKIPS such files silently, so platform/sdl2, platform/glfw and
  #      platform/egl were never looked at. The configure step now turns every
  #      optional backend on, and the step below fails if the database does not
  #      cover the scope -- so scope and coverage cannot drift apart quietly.
  check-clang-tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain, FFmpeg, clang-tidy and the optional backends
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build python3 pkg-config clang \
            clang-tidy libavformat-dev libavcodec-dev libavutil-dev \
            libswscale-dev libswresample-dev \
            libsdl2-dev libglfw3-dev libegl1-mesa-dev
      - name: Configure with every optional backend enabled
        run: |
          cmake --preset ffmpeg -DAVBASE_ENABLE_SDL2=ON \
            -DAVBASE_ENABLE_GLFW=ON -DAVBASE_ENABLE_EGL=ON
      # Every optional backend is an `if(<pkg>_FOUND)` gate, not a hard error:
      # a missing dev package drops a whole directory from the build and the
      # configure step still succeeds. The coverage check below would then
      # report the symptom -- "this file is not in the compilation database"
      # -- without naming the cause. Building the three targets explicitly
      # converts it into "no rule to make target 'avbase_platform_egl'", which
      # says which package did not install.
      - name: The optional backend targets must exist
        run: |
          cmake --build --preset ffmpeg --target avbase_platform_sdl2 \
            avbase_platform_glfw avbase_platform_egl
      - run: cmake --build --preset ffmpeg
      - name: The compilation database must cover the whole scope
        run: |
          git ls-files 'base/*.cc' 'media/*.cc' 'player/*.cc' \
                       'platform/*.cc' 'tools/*.cc' \
            | grep -v 'legacy/' > /tmp/tidy-scope.txt
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          db = json.load(open("build/ffmpeg/compile_commands.json"))
          known = set()
          for entry in db:
              path = entry["file"]
              if not os.path.isabs(path):
                  path = os.path.join(entry.get("directory", ""), path)
              known.add(os.path.normpath(os.path.abspath(path)))

          # Files this platform genuinely cannot compile. Say why: a scope that
          # shrinks without anyone noticing is how this job checked nothing.
          exempt = {
              "platform/hwimport/cgl_iosurface_importer.cc":
                  "Apple-only (CGL/IOSurface); guarded by if(APPLE) in "
                  "platform/CMakeLists.txt, so no Linux database has it.",
          }

          missing = []
          for rel in open("/tmp/tidy-scope.txt").read().split():
              missing_rel = rel
              if missing_rel in exempt:
                  continue
              if os.path.normpath(os.path.abspath(rel)) not in known:
                  missing.append(missing_rel)

          print(f"scope={len(open('/tmp/tidy-scope.txt').read().split())} "
                f"database={len(known)} missing={len(missing)}")
          for path in missing:
              print(f"  not in compilation database: {path}")
          if missing:
              sys.exit("scope is not covered; these files would be skipped "
                       "silently -- enable their backend or exempt them here "
                       "with a reason")
          PY
      - name: clang-tidy over non-test sources
        run: |
          files=$(git ls-files 'base/*.cc' 'media/*.cc' 'player/*.cc' \
                         'platform/*.cc' 'tools/*.cc' | grep -v 'legacy/' )
          /usr/lib/llvm-18/bin/run-clang-tidy -p build/ffmpeg -quiet -j4 $files

  # cpplint over the project config (CPPLINT.cfg). Its fix-the-tree round
  # brought the non-test, non-legacy tree to zero findings, which is what let
  # it go in blocking instead of advisory (R12: a gate must arrive green to be
  # believed). Scoped like check-clang-tidy -- tests carry gtest idioms and
  # media/filters/legacy/ is the LGPL quarantine -- and CPPLINT.cfg is the
  # source of truth, so cpplint runs with no extra flags. The one category
  # turned off there is build/c++11, a stale whitelist that rejects <chrono>,
  # <mutex>, <thread>; the project is C++20 and uses them deliberately.
  check-cpplint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install cpplint
        run: |
          python3 -m venv "$RUNNER_TEMP/cpplint-venv"
          "$RUNNER_TEMP/cpplint-venv/bin/pip" install "cpplint==1.6.1"
      - name: cpplint must report no errors
        run: |
          # Same file list check-clang-tidy uses (see the comment above that
          # job): non-test, non-legacy sources.
          files=$(git ls-files 'base/*.cc' 'media/*.cc' 'player/*.cc' \
                         'platform/*.cc' 'tools/*.cc' | grep -v 'legacy/')
          "$RUNNER_TEMP/cpplint-venv/bin/cpplint" --repository=. $files

  # docs/10 §12 acceptance criterion: doxygen over player/public with ZERO
  # warnings. tools/gen_api_docs.sh asserts that itself three ways
  # (WARN_AS_ERROR, the warn-log, and stderr), so a warning can neither pass
  # silently nor hide behind a zero exit.
  #
  # The third assertion in that script exists because of a failure mode found
  # locally: doxygen is SILENT when an INPUT_FILTER produces empty output --
  # an empty stream parses as an empty file, so zero warnings survive while
  # every brief is gone and API.md degrades to bare signatures. The script
  # therefore also asserts the XML actually carries prose.
  #
  # The final `git diff --exit-code` is the part that makes this a gate rather
  # than a generator: editing a player/public comment without regenerating
  # docs/API.md is a review failure this catches mechanically.
  apidocs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen
      - name: Regenerate docs/API.md, expect zero doxygen warnings
        run: |
          tools/gen_api_docs.sh
          git diff --exit-code docs/API.md

  # docs/10 §12 acceptance criterion (V9): every public method's comment in
  # player/public answers four questions (what / thread+blocking / failure /
  # side effects), and coverage of declarations that HAVE a comment is >= 95%.
  # No libclang: a line-state machine keeps the check runnable on a clean
  # runner the way apidocs' own gate is. --min-full-rate 0 = report the
  # four-dimension "full" metric but do not fail on it yet (pure getters
  # legitimately answer "none"; forcing the wording is the noise the design
  # avoids -- see tools/check_comment_coverage.py's docstring).
  commentcov:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        run: sudo apt-get update && sudo apt-get install -y python3
      - name: V9 public comment coverage
        run: python3 tools/check_comment_coverage.py --min-existence-rate 95 --min-full-rate 0

  # docs/10 §4 and §12 acceptance criterion (V10): a minor version bump must
  # not break user code. tools/check_api_compat.py diffs the declared public
  # API surface (functions, methods, operators, ctors/dtors, enums, and
  # per-class vtable layout) against the committed baseline
  # tools/api_baseline.json. No libclang and no build: a committed baseline is
  # the "last released surface", and a pure-Python diff keeps the check
  # runnable on a clean runner the way commentcov is. A missing baseline is a
  # hard error, because compatibility cannot be proven without it -- so the
  # baseline is committed and refreshed only when a MAJOR version is cut (with
  # --allow-breaking), exactly as the tool's docstring describes.
  apicompat:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Python
        run: sudo apt-get update && sudo apt-get install -y python3
      - name: V10 API surface diff vs committed baseline
        run: python3 tools/check_api_compat.py

  # docs/04 §8 and docs/07 §10 (M13): self-contained micro-benchmarks. No
  # Google Benchmark (it cannot be fetched in the sandbox and the runner should
  # not have to install it), no FFmpeg (the harness links only avbase::base).
  # This job does NOT hard-fail on regression: the committed baseline is
  # measured on the developer's machine (gate_local --jobs bench uses it), and a
  # single shared CI runner is too noisy for a 10% gate. Here it records the
  # numbers and uploads them as an artifact so the trend can be watched; the
  # same command run locally with --fail-on-regression is the actionable gate.
  bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++ python3
      - name: Configure (bench only, no FFmpeg)
        run: cmake -B build/bench -G Ninja -DAVBASE_BUILD_BENCH=ON -DAVBASE_BUILD_TESTS=OFF -DAVBASE_ENABLE_FFMPEG=OFF
      - name: Build benchmarks
        run: cmake --build build/bench --target avbase_benchmarks -j
      - name: Run benchmarks
        run: |
          bin="$(find build/bench -name avbase_benchmarks -type f | head -1)"
          # Three runs appended to one file: check_bench_regression.py takes
          # the median per benchmark. Run-to-run spread dominates
          # round-to-round spread here, and --iters must match the value used
          # to produce tools/bench-baseline.jsonl.
          for i in 1 2 3; do
            "$bin" --iters 20000 --rounds 11 --jsonl bench-run.jsonl
          done
      - name: Upload trend artifact
        uses: actions/upload-artifact@v4
        with:
          name: bench-run
          path: bench-run.jsonl
      - name: Diff against baseline (report only, non-blocking)
        run: |
          python3 tools/check_bench_regression.py \
            --baseline tools/bench-baseline.jsonl \
            --current bench-run.jsonl || true

  # A `check-gl-constants` job used to sit here. It machine-checked the
  # hand-written enumerant table in render/gl/gl_constants.h against the
  # platform's GL headers, because a typo in that table compiles clean and only
  # fails at runtime as a driver error nobody reads -- not hypothetically:
  # GL_VERTEX_SHADER was once 0x8B33 there, and glCreateShader() returned 0
  # with an empty info log while the card was fine.
  #
  # That table no longer exists. render/gl/third_party/glad/ now carries the
  # enumerants and the entry points as generated output derived from Khronos'
  # own XML, so the failure mode was removed rather than guarded against. A job
  # here could only assert that glad generated what glad generates.

  # Every style gate the project keeps is now present and blocking:
  # check-format, check-clang-tidy and check-cpplint. Still open
  # (docs/12-剩余工作清单.md): check-no-vendor-leak, the coverage job (a
  # `lcov --summary || true` that cannot fail), and the ffmpeg-matrix /
  # e2e-linux jobs, both still `if: false`.
