# cpplint configuration for the avbase tree.
#
# This file, like .clang-format and .clang-tidy, is a source of truth: the
# check-cpplint CI job runs cpplint with no extra flags so that the settings
# here are exactly what the gate enforces.
set noparent

# Matches .clang-format's ColumnLimit and the C23 over-length ratchet.
linelength=80

# build/c++11 is a stale Google-era whitelist: it rejects <chrono>, <mutex>,
# <thread>, <condition_variable>, ... as "unapproved C++11 headers". avbase
# builds as C++20 (see .clang-format: Standard: c++20) and uses those headers
# deliberately -- the async transcode entry (round 31) is built on <thread>
# and <mutex>, the live-edge clock on <chrono>. The category is therefore
# turned off wholesale. Every other cpplint category is enforced.
filter=-build/c++11
